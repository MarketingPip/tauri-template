name: Build and Commit Tauri App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: windows-latest
    
    permissions:
      contents: write # Required to push commits back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'pnpm'

      - name: Set up Rust Toolchain (1.77.2 for Windows 7 Compatibility)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.77.2

      - name: Download and Extract WebView2 Runtime (.cab)
        shell: pwsh
        run: |
          $cabUrl = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreaming/files/2c3a50bc-59d4-4632-a5e6-bb7c1b1c3c9c/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab"
          # Fallback link or direct package download URL if needed. Let's use a robust method:
          $targetDir = "src-tauri\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64"
          
          if (!(Test-Path $targetDir)) {
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              Write-Host "Downloading WebView2 Fixed Version CAB..."
              $cabPath = "webview2.cab"
              
              # Official Microsoft Evergreen/Fixed CDN pattern or NuGet package extraction fix:
              # Let's download directly from NuGet package zip content where the files reside:
              $nugetUrl = "https://www.nuget.org/api/v2/package/WebView2.Runtime.X64/109.0.1518.78"
              Invoke-WebRequest -Uri $nugetUrl -OutFile "webview2.zip"
              
              Expand-Archive -Path "webview2.zip" -DestinationPath "webview2_temp" -Force
              
              # Find where the actual binaries (msedgewebview2.exe) are located inside the NuGet unzipped folders
              $sourceBin = Get-ChildItem -Path "webview2_temp" -Recurse -Filter "msedgewebview2.exe" | Select-Object -First 1
              
              if ($sourceBin) {
                  $runtimeBinDir = $sourceBin.Directory.FullName
                  Write-Host "Found WebView2 binaries at: $runtimeBinDir"
                  Copy-Item -Path "$runtimeBinDir\*" -Destination $targetDir -Recurse -Force
                  Write-Host "Successfully populated $targetDir"
              } else {
                  throw "Could not locate msedgewebview2.exe inside the downloaded package."
              }
          } else {
              Write-Host "WebView2 runtime directory already exists."
          }

      - name: Install Dependencies & Approve Builds
        run: |
          pnpm install || (pnpm approve-builds --all && pnpm install)

      - name: Build Tauri Application
        run: pnpm tauri build

      - name: Commit and Push Build Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(build): auto-update Tauri build artifacts [skip ci]"
          file_pattern: "src-tauri/target/release/bundle/*"
          branch: ${{ github.ref_name }}
