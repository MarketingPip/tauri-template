name: Build and Commit Tauri App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: windows-latest
    
    permissions:
      contents: write # Required to push commits back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'pnpm'

      - name: Set up Rust Toolchain (1.77.2 for Windows 7 Compatibility)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.77.2

      - name: Download and Extract WebView2 Runtime (.cab)
        shell: pwsh
        run: |
          $targetDir = "src-tauri\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x86"
          
          if (!(Test-Path $targetDir)) {
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              Write-Host "Downloading WebView2 Fixed Version package..."
              $nugetUrl = "https://www.nuget.org/api/v2/package/WebView2.Runtime.X86/109.0.1518.78"
              Invoke-WebRequest -Uri $nugetUrl -OutFile "webview2.zip"
              
              Expand-Archive -Path "webview2.zip" -DestinationPath "webview2_temp" -Force
              
              $sourceBin = Get-ChildItem -Path "webview2_temp" -Recurse -Filter "msedgewebview2.exe" | Select-Object -First 1
              
              if ($sourceBin) {
                  $runtimeBinDir = $sourceBin.Directory.FullName
                  Write-Host "Found WebView2 binaries at: $runtimeBinDir"
                  Copy-Item -Path "$runtimeBinDir\*" -Destination $targetDir -Recurse -Force
                  Write-Host "Successfully populated $targetDir"
              } else {
                  throw "Could not locate msedgewebview2.exe inside the downloaded package."
              }
          } else {
              Write-Host "WebView2 runtime directory already exists."
          }

      - name: Install Dependencies & Approve Builds
        run: |
          pnpm install || (pnpm approve-builds --all && pnpm install)

      - name: Build Tauri Application
        run: pnpm tauri build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-installers
          path: |
           src-tauri/target/release/bundle/msi/*.msi
           src-tauri/target/release/bundle/nsis/*.exe
